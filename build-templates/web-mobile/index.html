<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Web Mario – 113006230</title>
  <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>
  <meta name="screen-orientation" content="<%=orientation%>"/>
  <meta name="x5-orientation" content="<%=orientation%>">
  <meta name="x5-page-mode" content="app">
  <link rel="stylesheet" type="text/css" href="style-mobile.css"/>
  <link rel="icon" href="favicon.ico"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
    }
    /* Hide CC's canvas – our game canvas is created by MarioBundle.js */
    #GameCanvas { display: none !important; }
    #splash { display: none !important; }
    #gameCanvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 3px solid #444;
      display: block;
      max-width: 100vw;
    }
    #userInfo { color: #FFD700; font-size: 11px; margin-top: 6px; height: 16px; }
    #controls { color: #666; font-size: 10px; margin-top: 8px; text-align: center; line-height: 1.6; }
    #loginModal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.75); z-index: 200;
      align-items: center; justify-content: center;
    }
    #loginModal.active { display: flex; }
    .modal-box {
      background: #1a1a2e; border: 3px solid #FFD700; border-radius: 8px;
      padding: 28px 24px; width: 320px; text-align: center; color: white;
    }
    .modal-box h2 { color: #FFD700; margin-bottom: 18px; font-size: 18px; }
    .modal-box input {
      width: 100%; padding: 9px 10px; margin: 5px 0;
      background: #0d0d1a; border: 1px solid #555; color: white;
      border-radius: 4px; font-family: monospace; font-size: 13px;
    }
    .modal-box button {
      width: 100%; padding: 10px; margin: 5px 0; cursor: pointer;
      border: none; border-radius: 4px; font-size: 13px;
      font-family: monospace; font-weight: bold;
    }
    .btn-primary   { background: #4CAF50; color: white; }
    .btn-secondary { background: #2196F3; color: white; }
    .btn-close     { background: #555; color: #ccc; }
    #authError { color: #FF4444; font-size: 12px; margin-top: 8px; min-height: 18px; }
  </style>
</head>
<body>
  <!-- CC canvas (hidden – our game canvas overlays it) -->
  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="splash">
    <div class="progress-bar stripes"><span style="width: 0%"></span></div>
  </div>

  <!-- Login Modal (shown by Firebase.js) -->
  <div id="loginModal">
    <div class="modal-box">
      <h2>🎮 WEB MARIO</h2>
      <p style="color:#aaa;font-size:11px;margin-bottom:12px;">Login to save your score!</p>
      <input type="email"    id="emailInput"    placeholder="Email">
      <input type="password" id="passwordInput" placeholder="Password">
      <button class="btn-primary"   id="loginBtn">LOGIN</button>
      <button class="btn-secondary" id="signupBtn">SIGN UP</button>
      <button class="btn-close"     id="guestBtn">PLAY AS GUEST</button>
      <p id="authError"></p>
    </div>
  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script src="src/settings.js" charset="utf-8"></script>
  <%=webDebugger%>
  <script src="main.js" charset="utf-8"></script>

  <script type="text/javascript">
  (function () {
      if (typeof VConsole !== 'undefined') {
          window.vConsole = new VConsole();
      }
      var debug = window._CCSettings.debug;
      var splash = document.getElementById('splash');
      if (splash) splash.style.display = 'block';

      function loadScript(moduleName, cb) {
          function scriptLoaded() {
              document.body.removeChild(domScript);
              domScript.removeEventListener('load', scriptLoaded, false);
              cb && cb();
          }
          var domScript = document.createElement('script');
          domScript.async = true;
          domScript.src = moduleName;
          domScript.addEventListener('load', scriptLoaded, false);
          document.body.appendChild(domScript);
      }

      loadScript(debug ? 'cocos2d-js.js' : 'cocos2d-js-min.js', function () {
          if (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON) {
              loadScript(debug ? 'physics.js' : 'physics-min.js', window.boot);
          } else {
              window.boot();
          }
      });
  })();
  </script>
</body>
</html>

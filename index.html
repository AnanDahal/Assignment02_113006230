<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Mario – 113006230</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: monospace;
        }
        #gameCanvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 3px solid #444;
            display: block;
            max-width: 100vw;
        }
        #userInfo {
            color: #FFD700;
            font-size: 11px;
            margin-top: 6px;
            height: 16px;
        }
        /* Login Modal */
        #loginModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        #loginModal.active { display: flex; }
        .modal-box {
            background: #1a1a2e;
            border: 3px solid #FFD700;
            border-radius: 8px;
            padding: 28px 24px;
            width: 320px;
            text-align: center;
            color: white;
        }
        .modal-box h2 { color: #FFD700; margin-bottom: 18px; font-size: 18px; }
        .modal-box input {
            width: 100%;
            padding: 9px 10px;
            margin: 5px 0;
            background: #0d0d1a;
            border: 1px solid #555;
            color: white;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }
        .modal-box button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-family: monospace;
            font-weight: bold;
        }
        .btn-primary   { background: #4CAF50; color: white; }
        .btn-secondary { background: #2196F3; color: white; }
        .btn-close     { background: #555; color: #ccc; }
        #authError { color: #FF4444; font-size: 12px; margin-top: 8px; min-height: 18px; }
        #controls {
            color: #666;
            font-size: 10px;
            margin-top: 8px;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div id="userInfo"></div>
    <div id="controls">
        ← → Move &nbsp;|&nbsp; ↑ / Space Jump &nbsp;|&nbsp; Shift Run &nbsp;|&nbsp; P/Esc Pause
    </div>

    <!-- Login / Signup Modal -->
    <div id="loginModal">
        <div class="modal-box">
            <h2>🎮 WEB MARIO</h2>
            <p style="color:#aaa;font-size:11px;margin-bottom:12px;">Login to save your score!</p>
            <input type="email"    id="emailInput"    placeholder="Email">
            <input type="password" id="passwordInput" placeholder="Password">
            <button class="btn-primary"   id="loginBtn">LOGIN</button>
            <button class="btn-secondary" id="signupBtn">SIGN UP</button>
            <button class="btn-close"     id="guestBtn">PLAY AS GUEST</button>
            <p id="authError"></p>
        </div>
    </div>

    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Game scripts – order matters (dependency chain) -->
    <script src="js/Constants.js?v=11"></script>
    <script src="js/Sprites.js?v=11"></script>
    <script src="js/Audio.js?v=11"></script>
    <script src="js/Input.js?v=11"></script>
    <script src="js/Camera.js?v=11"></script>
    <script src="js/Level.js?v=11"></script>
    <script src="js/entities/Player.js?v=11"></script>
    <script src="js/entities/Goomba.js?v=11"></script>
    <script src="js/entities/Mushroom.js?v=11"></script>
    <script src="js/entities/QuestionBlock.js?v=11"></script>
    <script src="js/HUD.js?v=11"></script>
    <script src="js/Firebase.js?v=11"></script>
    <script src="js/scenes/MenuScene.js?v=11"></script>
    <script src="js/scenes/LevelSelectScene.js?v=11"></script>
    <script src="js/scenes/GameScene.js?v=11"></script>
    <script src="js/scenes/GameOverScene.js?v=11"></script>
    <script src="js/scenes/LevelClearScene.js?v=11"></script>
    <script src="js/Game.js?v=11"></script>
    <script src="js/main.js?v=11"></script>
</body>
</html>
